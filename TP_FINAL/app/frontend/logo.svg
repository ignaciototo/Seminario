<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Stylized Heart Outline Behind Pulse -->
  <path d="M 50,30 
           C 50,22 41,16 31,16 
           C 18,16 14,28 14,38 
           C 14,56 36,70 50,82 
           C 64,70 86,56 86,38 
           C 86,28 82,16 69,16 
           C 59,16 50,22 50,30 Z" 
        fill="none" 
        stroke="#0369a1" 
        stroke-width="3" 
        stroke-dasharray="3,3" 
        opacity="0.6" />

  <!-- ECG Heartbeat / Pulse Wave Line -->
  <path d="M 16,52 
           L 32,52 
           L 37,42 
           L 43,64 
           L 50,28 
           L 57,72 
           L 63,47 
           L 68,54 
           L 84,54" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Pulse Node Dots -->
  <circle cx="50" cy="28" r="3.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="57" cy="72" r="3" fill="#f43f5e" />
  <circle cx="16" cy="52" r="2.5" fill="#38bdf8" />
  <circle cx="84" cy="54" r="2.5" fill="#f43f5e" />
</svg>
